#
# Steelbore palette family — canonical color contract (Standard §11, v1.35)
# Six palettes: steelbore (Modern, DEFAULT), steelbore-classic, and four
# alternates. Every palette binds the same eleven §11.1 role tokens except
# Classic, which keeps its legacy six-role contract (§11.2).
# All contrast ratios computed with the WCAG 2.2 relative-luminance formula.
# Normative targets: WCAG 2.2 Level AA; EN 301 549 V4.1.1 clause 11 (non-web software).
# A project uses ONE palette (§11.4); tokens are never mixed across palettes.

[meta]
name = "Steelbore"
default-theme = "steelbore"
palette-family = ["steelbore", "steelbore-classic", "steelbore-blue", "steelbore-blackpinkpanther", "steelbore-matrixgreen", "steelbore-navywhite"]
version = "3.0.0"
date = "2026-07-25T00:00:00Z"
maintainer = "Mohamed Hammad <Mohamed.Hammad@SpacecraftSoftware.org>"
website = "https://Construct.SpacecraftSoftware.org/"
license = "GPL-3.0-or-later"
standard = "The Steelbore Standard §11 (v1.35)"

