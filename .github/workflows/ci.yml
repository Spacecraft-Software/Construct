name: CI

on:
  pull_request:
  push:
    branches: [main]

  # Manual re-run, because the event-driven triggers above are not guaranteed to
  # fire. Between 2026-08-05T21:03Z and 2026-08-07 this repository created no run
  # at all — not for a pull request, not for a push to main — while the workflow
  # reported `state=active`, Actions reported `enabled`, the triggers were these
  # ones, and the file parsed. Sibling repositories in the same org ran normally
  # in that window, so it was specific to this repository and invisible from the
  # API: nothing queued, nothing waiting, no failed run to notice.
  #
  # Without this trigger the only way to re-fire CI is a commit whose sole
  # purpose is to produce an event, and pushing one straight to main is exactly
  # what the branch-and-PR rule forbids. A missing gate here is the expensive
  # kind: this job is what enforces the §5.6 description cap and the
  # steelbore.scm drift check, both of which fail silently when unenforced.
  #
  #   gh workflow run ci.yml --ref main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: REUSE + config + skill-description validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install reuse pyyaml

      - name: REUSE lint
        run: reuse lint

      - name: Validate JSON / JSONC / TOML / YAML
        run: python3 .github/validate-configs.py

      # Standard §5.6: the description cap is enforced by CI, not only by the
      # opt-in .githooks pre-commit hook (which needs `git config
      # core.hooksPath .githooks` per clone and so cannot be relied on).
      # `find` rather than a glob list, so grok-skills/, android-skills/, and
      # any future nesting are covered without a list to maintain.
      - name: SKILL.md description cap (<= 1000 rendered chars)
        run: |
          find . -name SKILL.md -not -path './.git/*' -print0 \
            | xargs -0 python3 .githooks/check-description-length.py

      # The gates above verify each skill in isolation. This one verifies that a
      # skill still agrees with the catalogue around it: that every skill id it
      # names resolves to a real directory, and that it does not pin a Standard
      # *document* version (which rots on any unrelated release — cite the
      # section, or say when that section last changed).
      - name: Skill cross-references + version pins
        run: python3 .github/check-skill-refs.py --catalogue . .

      # steelbore.scm is a GENERATED Guile mirror of steelbore.toml, shipped
      # because Guix evaluates system configuration in plain Guile and Guile has
      # no TOML reader — so Standard §11.6.5's obligations on the Guix flavor of
      # Steelbore OS (Ginx) would otherwise mean retyping values §11.4 says are
      # read, never retyped. Two files carrying the same values only stay honest
      # if drift is a build failure, which is what this step is for.
      - name: steelbore.scm matches steelbore.toml
        run: python3 .github/generate-steelbore-scm.py --check

  # construct-cli/ is the one real build surface in this repo — everything else
  # is markdown. It went ungated until now, which is how a clippy break
  # (items_after_test_module in src/sources/skillmd.rs) sat unnoticed on main:
  # the lint job above never invokes cargo.
  #
  # Deliberately not path-filtered. A filtered job reports nothing at all when
  # it is skipped, which makes it unusable as a required status check; the
  # cache makes a markdown-only PR cheap enough that always running is the
  # better trade.
  cargo:
    name: construct-cli — fmt + clippy + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: construct-cli
    steps:
      - uses: actions/checkout@v4

      # Stable, not the declared MSRV: clippy lints and rustfmt output drift
      # between versions, so pinning the gate to the MSRV would freeze both. See
      # the msrv job below for the compatibility check.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: construct-cli

      - name: Format
        run: cargo fmt --check

      # -D warnings matches construct-cli/CLAUDE.md; a warning is a failure.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # Separate from the gate above so an MSRV bump is a visible, deliberate
  # change rather than something that silently rides along with a dependency
  # update. Keep the version in step with `rust-version` in Cargo.toml.
  msrv:
    name: construct-cli — MSRV (1.88)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: construct-cli
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: construct-cli
          key: msrv

      # `check`, not `test`: dev-dependencies are not bound by the MSRV the
      # crate advertises to consumers.
      - name: Check against the declared MSRV
        run: cargo check --all-features
