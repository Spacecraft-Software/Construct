#
# Perplexity consolidation map, read by `construct skill build --target
# perplexity`. Perplexity rejects a skill zip with more than 100 files; any
# skill over that needs an entry here, keyed by skill id, so a second oversized
# skill needs data, not code.
#
# Each [[skill.<id>.category]] becomes references/<slug>.md, titled <title>,
# merging references/<tool>.md for every listed tool. The build refuses when
# the tools listed here differ from the skill's references/*.md stems (minus
# passthrough), so add or remove a tool here in the same change as the skill.

schema = 1

[skill.spacecraft-cli-preference]
# Non-tool reference files: copied through verbatim, never consolidated.
passthrough = ["ATTRIBUTION.md", "local-execution.md", "execution-context.md"]

[[skill.spacecraft-cli-preference.category]]
slug = "file-and-text"
title = "File & Text"
tools = ["eza", "bat", "fd", "ripgrep", "sd", "delta", "tokei", "jaq", "ouch",
  "uutils", "rustybox"]

